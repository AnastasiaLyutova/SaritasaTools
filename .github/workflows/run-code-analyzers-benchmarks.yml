name: Performance Comparison

on:
  pull_request:
    branches:
      - master

    paths:
      - 'src/Saritasa.Tools.CodeAnalyzers/**'
  
   # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  compare-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch (Current Changes)
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 'Install PowerUtils.BenchmarkDotnet.Reporter'
        run: dotnet tool install --global PowerUtils.BenchmarkDotnet.Reporter

      - name: 'Run benchmarks compare'
        run: pbreporter compare -b ./artifacts-base/results/Saritasa.Tools.CodeAnalyzers.Benchmarks.CodeAnalyzersBenchmarks-report-full-compressed.json -t ./artifacts-pr/results/Saritasa.Tools.CodeAnalyzers.Benchmarks.CodeAnalyzersBenchmarks-report-full-compressed.json -f markdown

      - name: 'Publish benchmark report in Summary'
        run: cat ./BenchmarkReporter/benchmark-comparison-report.md > $GITHUB_STEP_SUMMARY
      
      - name: 'Add compare benchmark report in PR Comment'
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: compare-benchmark-report
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          path: ./BenchmarkReporter/benchmark-comparison-report.md
        


